<!DOCTYPE html>
<html>
<head>
    <title>Редактировать продажу</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #F4E8D3; }
        .container { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 8px; border: 1px solid #bbb; padding: 30px 24px;}
        label { font-weight: bold; }
        .accent-btn { background: #67BA80; color: #fff; border: none; padding: 10px 18px; border-radius: 5px; font-weight: bold; margin-top: 14px; }
        .accent-btn:hover { background: #519e67; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Редактировать продажу</h2>
        <form method="post">
            <label for="product_id">Продукт:</label><br>
            <select name="product_id" id="product_id" required>
                {% for product in products %}
                <option value="{{ product.id }}" {% if product.id == sale.product_id %}selected{% endif %}>{{ product.name }}</option>
                {% endfor %}
            </select><br><br>
            <label for="quantity">Количество:</label><br>
            <input type="number" name="quantity" id="quantity" min="1" value="{{ sale.quantity }}" required><br><br>
            <label for="sale_date">Дата продажи:</label><br>
            <input type="date" name="sale_date" id="sale_date" value="{{ sale.sale_date }}" required><br><br>
            <input type="submit" class="accent-btn" value="Сохранить">
        </form>
        <a href="{{ url_for('partner_history', partner_id=partner_id) }}">Назад к истории</a>
    </div>
</body>
</html>
